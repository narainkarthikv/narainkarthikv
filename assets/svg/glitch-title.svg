<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title description">
  <title id="title">NarainKarthik Vellingiri</title>
  <desc id="description">Hi, I'm NarainKarthik Vellingiri. AI Augmented Software Engineer | Cloud &amp; DevOps Enthusiast, alternating every 5 seconds with BUILDING FOSS · LEVELING UP IRL · BOOKSHELF &amp; SCREEN NERD. A chibi hacker wears wired earbuds, sits at a desk using a MacBook-style laptop, and waves from the right. &gt;&gt; ACCESS GRANTED: EXPLORE MY WORK</desc>
  <defs>
    <clipPath id="glitch-slice-a"><rect x="0" y="75" width="1200" height="12"/></clipPath>
    <clipPath id="glitch-slice-b"><rect x="0" y="101" width="1200" height="7"/></clipPath>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset=".22" stop-color="#3B82F6" stop-opacity=".72"/>
      <stop offset=".78" stop-color="#3B82F6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="micro-distortion" x="-3%" y="-18%" width="106%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .08" numOctaves="1" seed="2" result="noise">
        <animate attributeName="seed" values="2;2;7;1;2" keyTimes="0;.68;.71;.75;1" dur="3.6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="0;0;3;0;2;0" keyTimes="0;.68;.71;.75;.91;1" dur="3.6s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>

